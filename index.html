<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikBatch — Bulk TikTok Downloader - HD VERSTION</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.18);
  --accent: #fe2c55;
  --accent2: #25f4ee;
  --text: #f0f0f0;
  --text-muted: #888;
  --text-dim: #555;
  --radius: 12px;
  --font-mono: 'Space Mono', monospace;
  --font-sans: 'DM Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(254,44,85,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(254,44,85,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}
.wrapper {
  position: relative; z-index: 1;
  max-width: 860px; margin: 0 auto;
  padding: 48px 24px 80px;
}
.header { text-align: center; margin-bottom: 48px; }
.logo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.logo-icon {
  width: 48px; height: 48px; background: var(--accent);
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.logo-icon::after {
  content: ''; position: absolute; top: -4px; right: -4px;
  width: 20px; height: 20px; background: var(--accent2); border-radius: 50%;
}
.logo-icon svg { position: relative; z-index: 1; }
.logo-text { font-family: var(--font-mono); font-size: 28px; font-weight: 700; letter-spacing: -1px; }
.logo-text span { color: var(--accent); }
.tagline { font-size: 14px; color: var(--text-muted); }

.format-hint {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 24px;
  display: flex; gap: 12px; align-items: flex-start;
}
.hint-icon {
  flex-shrink: 0; width: 20px; height: 20px;
  background: rgba(37,244,238,0.12); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.hint-text { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
.hint-text strong { color: var(--text); font-weight: 500; }
.hint-text pre {
  font-family: var(--font-mono); font-size: 11px;
  background: var(--surface2); border-radius: 6px;
  padding: 10px 12px; margin-top: 8px; color: var(--accent2);
  overflow-x: auto; border: 1px solid var(--border);
}

.upload-zone:hover 

.stats-bar {
  display: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px;
  align-items: center; gap: 24px; flex-wrap: wrap;
}
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-value { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.stat-value.accent { color: var(--accent); }
.stat-value.cyan { color: var(--accent2); }
.stat-value.green { color: #00c864; }
.stats-bar .divider { width: 1px; height: 36px; background: var(--border); }
.stats-bar .spacer { flex: 1; }

.controls {
  display: none; gap: 12px; margin-bottom: 20px;
  flex-wrap: wrap; align-items: center;
}
.filter-group { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
.filter-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text-muted);
  font-family: var(--font-sans); font-size: 13px;
  padding: 7px 14px; cursor: pointer; transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.action-btns { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 8px;
  font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; border: 1px solid transparent; text-decoration: none;
}
.btn-outline { background: transparent; border-color: var(--border-hover); color: var(--text-muted); }
.btn-outline:hover { border-color: var(--accent2); color: var(--accent2); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #e01e45; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.progress-wrap { display: none; margin-bottom: 20px; }
.progress-top { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
.progress-label { color: var(--text-muted); }
.progress-count { font-family: var(--font-mono); font-size: 12px; color: var(--accent2); }
.progress-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
  width: 0%; transition: width 0.3s ease; border-radius: 2px;
}

.video-grid { display: none; flex-direction: column; gap: 10px; margin-bottom: 32px; }
.video-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: center; gap: 14px; transition: border-color 0.15s;
}
.video-row:hover { border-color: var(--border-hover); }
.video-row.selected { border-color: rgba(254,44,85,0.4); background: rgba(254,44,85,0.04); }
.row-check { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.row-num { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); min-width: 28px; text-align: right; flex-shrink: 0; }
.row-avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--surface2);
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 10px; color: var(--accent2); flex-shrink: 0; font-weight: 700;
}
.row-info { flex: 1; min-width: 0; }
.row-handle { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--accent2); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-url { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-id { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); background: var(--surface2); padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }
.row-status { flex-shrink: 0; width: 88px; text-align: center; font-size: 12px; padding: 4px 10px; border-radius: 6px; font-weight: 500; }
.status-pending   { background: var(--surface2); color: var(--text-muted); }
.status-fetching  { background: rgba(37,244,238,0.1); color: var(--accent2); }
.status-done      { background: rgba(0,200,100,0.1); color: #00c864; }
.status-error     { background: rgba(254,44,85,0.1); color: var(--accent); }
.row-actions { display: flex; gap: 6px; flex-shrink: 0; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; color: var(--text-muted); text-decoration: none;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn.cyan:hover { border-color: var(--accent2); color: var(--accent2); }
.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface2); border: 1px solid var(--border-hover);
  border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text);
  transform: translateY(80px); opacity: 0;
  transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 999; max-width: 320px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: rgba(0,200,100,0.4); }
.toast.error   { border-color: rgba(254,44,85,0.4); }

.empty-state { text-align: center; padding: 40px; color: var(--text-dim); font-size: 14px; }
.spin {
  display: inline-block;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 600px) { .row-id, .row-url { display: none; } }

.paste-zone {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  margin-bottom: 28px; transition: border-color 0.2s;
}
.paste-zone:focus-within { border-color: rgba(254,44,85,0.4); }
.paste-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--text-muted); margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 0.8px; font-weight: 500;
}
.url-count {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--accent2); background: rgba(37,244,238,0.08);
  padding: 2px 10px; border-radius: 20px;
}
#url-input {
  width: 100%; height: 180px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: var(--font-mono); font-size: 12px;
  line-height: 1.8; padding: 14px 16px; resize: vertical;
  outline: none; transition: border-color 0.2s; caret-color: var(--accent);
}
#url-input::placeholder { color: var(--text-dim); }
#url-input:focus { border-color: rgba(254,44,85,0.3); }
.paste-actions {
  display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px;
}
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <div class="logo-text">Tik<span>Batch</span></div>
    </div>
    <p class="tagline">Paste your TikTok URLs below — one per line, fetches &amp; downloads automatically</p>
  </div>



  <div class="paste-zone">
    <div class="paste-label">
      <span>Paste TikTok URLs — one per line</span>
      <span class="url-count" id="url-count"></span>
    </div>
    <textarea id="url-input" placeholder="https://www.tiktok.com/@user/video/123&#10;https://www.tiktok.com/@user2/video/456&#10;https://www.tiktok.com/@user3/video/789" spellcheck="false"></textarea>
    <div class="paste-actions">
      <button class="btn btn-outline" id="clear-input-btn">Clear</button>
      <button class="btn btn-primary" id="load-btn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 8 12 12 14 14"/></svg>
        Load &amp; Fetch
      </button>
    </div>
  </div>

  <div class="stats-bar" id="stats-bar">
    <div class="stat">
      <span class="stat-value" id="stat-total">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <span class="stat-value accent" id="stat-selected">0</span>
      <span class="stat-label">Selected</span>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <span class="stat-value cyan" id="stat-handles">0</span>
      <span class="stat-label">Creators</span>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <span class="stat-value green" id="stat-ready">0</span>
      <span class="stat-label">Ready</span>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-outline" id="reset-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
      </svg>
      Reset
    </button>
  </div>

  <div class="controls" id="controls">
    <div class="filter-group">
      <button class="filter-btn active" id="filter-all-btn">All</button>
      <button class="filter-btn" id="filter-sel-btn">Selected</button>
      <div style="width:1px;background:var(--border);margin:0 4px"></div>
      <button class="filter-btn" id="select-all-btn">Select All</button>
      <button class="filter-btn" id="deselect-btn">Deselect All</button>
    </div>
    <div class="action-btns">
      <button class="btn btn-primary" id="download-btn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Selected
      </button>
    </div>
  </div>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-top">
      <span class="progress-label" id="progress-label">Fetching download links&hellip;</span>
      <span class="progress-count" id="progress-text">0 / 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="video-grid" id="video-grid"></div>

</div>

<div class="toast" id="toast"></div>

<script>
var videos = [];
var currentFilter = 'all';

var videoGrid  = document.getElementById('video-grid');
var statsBar   = document.getElementById('stats-bar');
var controls   = document.getElementById('controls');
var downloadBtn = document.getElementById('download-btn');
var urlInput   = document.getElementById('url-input');
var loadBtn    = document.getElementById('load-btn');
var urlCount   = document.getElementById('url-count');

urlInput.addEventListener('input', function() {
  var urls = parseInputURLs();
  if (urls.length > 0) {
    urlCount.textContent = urls.length + ' URL' + (urls.length !== 1 ? 's' : '');
    loadBtn.disabled = false;
  } else {
    urlCount.textContent = '';
    loadBtn.disabled = true;
  }
});

document.getElementById('clear-input-btn').addEventListener('click', function() {
  urlInput.value = '';
  urlCount.textContent = '';
  loadBtn.disabled = true;
  urlInput.focus();
});

loadBtn.addEventListener('click', function() {
  var urls = parseInputURLs();
  if (!urls.length) { showToast('No valid TikTok URLs found', 'error'); return; }
  processURLs(urls);
  loadBtn.disabled = true;
});

function parseInputURLs() {
  return urlInput.value
    .split('\n')
    .map(function(l) { return l.trim(); })
    .filter(function(l) { return l.length > 0 && l.indexOf('tiktok.com') !== -1; });
}

document.getElementById('reset-btn').addEventListener('click', function() {
  videos = [];
  videoGrid.style.display = 'none';
  statsBar.style.display = 'none';
  controls.style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'none';
  videoGrid.innerHTML = '';
  urlInput.value = '';
  urlCount.textContent = '';
  loadBtn.disabled = true;
  showToast('Reset — ready for new URLs', 'info');
});

document.getElementById('filter-all-btn').addEventListener('click', function() {
  currentFilter = 'all';
  document.getElementById('filter-all-btn').classList.add('active');
  document.getElementById('filter-sel-btn').classList.remove('active');
  renderGrid();
});
document.getElementById('filter-sel-btn').addEventListener('click', function() {
  currentFilter = 'selected';
  document.getElementById('filter-sel-btn').classList.add('active');
  document.getElementById('filter-all-btn').classList.remove('active');
  renderGrid();
});
document.getElementById('select-all-btn').addEventListener('click', function() {
  videos.forEach(function(v) { v.selected = true; });
  renderGrid(); updateStats();
});
document.getElementById('deselect-btn').addEventListener('click', function() {
  videos.forEach(function(v) { v.selected = false; });
  renderGrid(); updateStats();
});
downloadBtn.addEventListener('click', downloadSelected);



function extractHandle(url) { var m = url.match(/@([^\/\?]+)/); return m ? '@' + m[1] : '@unknown'; }
function extractVideoId(url) { var m = url.match(/video\/(\d+)/); return m ? m[1] : '???'; }
function getInitials(handle) { var h = handle.replace('@', ''); return h.length >= 2 ? h.slice(0,2).toUpperCase() : h.toUpperCase(); }

function processURLs(urls) {
  videos = urls.map(function(url, i) {
    return { id: i, url: url, handle: extractHandle(url), videoId: extractVideoId(url), selected: true, status: 'pending', dlUrl: null, hdUrl: null };
  });
  renderGrid(); updateStats();
  statsBar.style.display = 'flex';
  controls.style.display = 'flex';
  videoGrid.style.display = 'flex';
  showToast('Loaded ' + videos.length + ' video' + (videos.length !== 1 ? 's' : '') + ' — fetching links...', 'success');
  fetchAllLinks();
}

async function fetchAllLinks() {
  var progressWrap = document.getElementById('progress-wrap');
  var progressFill = document.getElementById('progress-fill');
  var progressText = document.getElementById('progress-text');
  document.getElementById('progress-label').textContent = 'Fetching download links\u2026';
  progressWrap.style.display = 'block';
  progressFill.style.width = '0%';
  progressText.textContent = '0 / ' + videos.length;

  for (var i = 0; i < videos.length; i++) {
    setStatus(i, 'fetching');
    await fetchLink(i);
    var pct = Math.round(((i + 1) / videos.length) * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = (i + 1) + ' / ' + videos.length;
    updateStats();
    if (i < videos.length - 1) await sleep(300);
  }

  var ready = videos.filter(function(v) { return v.dlUrl; }).length;
  document.getElementById('progress-label').textContent = 'Done — ' + ready + ' of ' + videos.length + ' links fetched';
  showToast(ready + ' videos ready to download', 'success');
}

async function fetchLink(id) {
  var v = videos[id];
  var apiUrl = 'https://www.tikwm.com/api/?url=' + encodeURIComponent(v.url) + '&hd=1';
  try {
    var res = await fetch(apiUrl);
    var data = await res.json();
    if (data.code === 0 && data.data) {
      v.dlUrl = data.data.play || data.data.wmplay || null;
      v.hdUrl = v.dlUrl;
      v.title = data.data.title || v.handle;
      setStatus(id, v.dlUrl ? 'done' : 'error');
    } else {
      setStatus(id, 'error');
    }
  } catch(e) {
    setStatus(id, 'error');
  }
  renderRow(id);
}

function renderGrid() {
  var list = currentFilter === 'all' ? videos : videos.filter(function(v) { return v.selected; });
  if (list.length === 0) { videoGrid.innerHTML = '<div class="empty-state">No videos match this filter</div>'; return; }
  videoGrid.innerHTML = list.map(function(v) { return rowHTML(v); }).join('');
}

function renderRow(id) {
  var existing = document.getElementById('row-' + id);
  if (!existing) return;
  existing.outerHTML = rowHTML(videos[id]);
}

function rowHTML(v) {
  var statusMap = { pending: 'status-pending', fetching: 'status-fetching', done: 'status-done', error: 'status-error' };
  var labelMap  = { pending: 'Pending', fetching: '<span class="spin">&#8635;</span> Fetching', done: 'Ready', error: 'Failed' };
  var sc = statusMap[v.status] || 'status-pending';
  var sl = labelMap[v.status] || 'Pending';
  var checked = v.selected ? 'checked' : '';
  var selClass = v.selected ? ' selected' : '';
  var dlDisabled = v.dlUrl ? '' : 'disabled';

  return '<div class="video-row' + selClass + '" id="row-' + v.id + '">' +
    '<input type="checkbox" class="row-check" ' + checked + ' onchange="toggleVideo(' + v.id + ', this.checked)">' +
    '<span class="row-num">#' + (v.id + 1) + '</span>' +
    '<div class="row-avatar">' + getInitials(v.handle) + '</div>' +
    '<div class="row-info">' +
      '<div class="row-handle">' + v.handle + '</div>' +
      '<div class="row-url">' + v.url + '</div>' +
    '</div>' +
    '<span class="row-id">' + v.videoId + '</span>' +
    '<span class="row-status ' + sc + '" id="status-' + v.id + '">' + sl + '</span>' +
    '<div class="row-actions">' +
      '<button class="icon-btn cyan" title="Download video" ' + dlDisabled + ' onclick="triggerDownload(' + v.id + ')">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
      '</button>' +
      '<a class="icon-btn" href="' + v.url + '" target="_blank" title="Open on TikTok">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
      '</a>' +
    '</div>' +
  '</div>';
}

function toggleVideo(id, checked) {
  videos[id].selected = checked;
  var row = document.getElementById('row-' + id);
  if (row) row.classList.toggle('selected', checked);
  updateStats();
}

function updateStats() {
  var sel   = videos.filter(function(v) { return v.selected; }).length;
  var ready = videos.filter(function(v) { return v.dlUrl; }).length;
  document.getElementById('stat-total').textContent   = videos.length;
  document.getElementById('stat-selected').textContent = sel;
  document.getElementById('stat-handles').textContent  = new Set(videos.map(function(v) { return v.handle; })).size;
  document.getElementById('stat-ready').textContent    = ready;
  var selReady = videos.filter(function(v) { return v.selected && v.dlUrl; }).length;
  downloadBtn.disabled = selReady === 0;
}

function setStatus(id, status) {
  if (videos[id]) videos[id].status = status;
  var el = document.getElementById('status-' + id);
  if (!el) return;
  var classes = { fetching: 'status-fetching', done: 'status-done', error: 'status-error', pending: 'status-pending' };
  var labels  = { fetching: '<span class="spin">&#8635;</span> Fetching', done: 'Ready', error: 'Failed', pending: 'Pending' };
  el.className  = 'row-status ' + (classes[status] || 'status-pending');
  el.innerHTML  = labels[status] || 'Pending';
}

function triggerDownload(id) {
  var v = videos[id];
  if (!v || !v.dlUrl) return;
  var filename = v.handle + '.mp4';
  forceDownload(v.hdUrl || v.dlUrl, filename);
}

async function forceDownload(url, filename) {
  try {
    var res = await fetch(url);
    var blob = await res.blob();
    var blobUrl = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 10000);
  } catch(e) {
    window.open(url, '_blank');
    showToast('Save the file manually as: ' + filename, 'info');
  }
}

async function downloadSelected() {
  var selected = videos.filter(function(v) { return v.selected && v.dlUrl; });
  if (!selected.length) return;

  var progressWrap  = document.getElementById('progress-wrap');
  var progressFill  = document.getElementById('progress-fill');
  var progressText  = document.getElementById('progress-text');
  document.getElementById('progress-label').textContent = 'Downloading\u2026';
  progressWrap.style.display = 'block';
  progressFill.style.width = '0%';
  progressText.textContent = '0 / ' + selected.length;

  for (var i = 0; i < selected.length; i++) {
    var v = selected[i];
    var filename = v.handle + '.mp4';
    forceDownload(v.hdUrl || v.dlUrl, filename);
    var pct = Math.round(((i + 1) / selected.length) * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = (i + 1) + ' / ' + selected.length;
    if (i < selected.length - 1) await sleep(600);
  }

  showToast('Downloading ' + selected.length + ' video' + (selected.length !== 1 ? 's' : ''), 'success');
}

function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 3500);
}
</script>
